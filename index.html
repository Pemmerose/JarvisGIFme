<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis GIF Picker</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333;
      --button-bg: #007BFF;
    }
    /* Dark mode by default */
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --button-bg: #3700b3;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background 0.3s;
    }

    .toggle-container {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    /* Keeps image perfectly centered in the available viewport space */
    img {
      max-width: 80%;
      max-height: 65vh;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    /* Fixed static position at the bottom of the viewport */
    .button-container {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: white;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="toggle-container">
    <button onclick="document.body.classList.toggle('dark-mode')">Toggle Theme</button>
  </div>

  <img id="gifDisplay" src="" style="display:none;" alt="Jarvis GIF">
  
  <div class="button-container">
    <button onclick="fetchRelevantGif()">Jarvis pull up the GIF</button>
    <button id="copyBtn" onclick="copyGifUrl()" style="display:none;">Copy Link</button>
  </div>

  <script>
    const apiKey = "OoWTQc168OAzTyPKXoYTooqUGgoMOg7n"; 
    const query = "jarvis"; 
    let currentUrl = "";

    async function fetchRelevantGif() {
      const imgElement = document.getElementById("gifDisplay");
      const copyBtn = document.getElementById("copyBtn");
      
      try {
        const response = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${apiKey}&q=${encodeURIComponent(query)}&limit=50`);
        const result = await response.json();
        
        // Handle Giphy API Rate Limit (Status 429) or other errors cleanly
        if (result.meta && result.meta.status !== 200) {
          alert(`Giphy API Error: ${result.meta.msg} (Status: ${result.meta.status})`);
          return;
        }

        if (result.data && result.data.length > 0) {
          const randomIndex = Math.floor(Math.random() * result.data.length);
          
          // Mixed Content Fix: Enforce HTTPS protocol on the raw URL string
          let rawUrl = result.data[randomIndex].images.original.url;
          currentUrl = rawUrl.replace(/^http:\/\//i, 'https://');
          
          imgElement.src = currentUrl;
          imgElement.style.display = "block";
          copyBtn.style.display = "inline";
        } else {
          alert("No GIFs found for this search query.");
        }
      } catch (error) {
        alert("Network Error: Could not connect to API.");
        console.error(error);
      }
    }

    function copyGifUrl() {
      if (!currentUrl) return;
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert("Link copied to clipboard! (✿◕‿◕)");
      }).catch(err => {
        alert("Failed to copy link.");
      });
    }

    // Automatically triggers a random pull immediately when web app initializes
    window.onload = fetchRelevantGif;
  </script>
</body>
</html>
